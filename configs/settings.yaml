agent:
  max_retrieval_loops: 2
  max_subqueries: 4
  # Agentic (wiki) retrieval engine. The wiki discovery layer is the retrieval
  # engine (RAG_WIKI_ENABLED=true is required; there is no dense fallback).
  discovery_top_k: 12
  max_read_docs: 4
  max_read_chunks_per_doc: 24
  max_context_text_chars: 6000
  freshness_policy:
    enabled: true
    include_stale: false

# Document-level BM25 discovery layer (the wiki). On by default: it is the
# agent's first-hop index. RAG_WIKI_ENABLED=true|false overrides at runtime.
discovery:
  enabled: ${RAG_WIKI_ENABLED:-true}

prompt:
  version: v1
  max_context_chars: 48000
  max_context_item_chars: 6000

timeout:
  rerank_seconds: 30
  generation_seconds: 120
  document_parser_seconds: 120
