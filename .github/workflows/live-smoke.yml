name: Live Smoke

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  configured_model:
    name: Env-configured Model Live Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -f docker/app.Dockerfile -t nano-rag-live-smoke .

      - name: Run live smoke
        env:
          MODEL_GATEWAY_MODE: live
          GENERATION_API_BASE_URL: ${{ vars.GENERATION_API_BASE_URL }}
          GENERATION_API_KEY: ${{ secrets.GENERATION_API_KEY }}
          GENERATION_MODEL_ALIAS: ${{ vars.GENERATION_MODEL_ALIAS }}
          DOCUMENT_PARSER_PROVIDER: ${{ vars.DOCUMENT_PARSER_PROVIDER }}
          DOCUMENT_PARSER_API_BASE_URL: ${{ vars.DOCUMENT_PARSER_API_BASE_URL }}
          DOCUMENT_PARSER_API_KEY: ${{ secrets.DOCUMENT_PARSER_API_KEY }}
          DOCUMENT_PARSER_MODEL: ${{ vars.DOCUMENT_PARSER_MODEL }}
          RAG_GRAPH_BACKEND: artifact
          RAG_ENV: test
          RAG_AUTH_DISABLED: "true"
        run: |
          docker run --rm \
            -e MODEL_GATEWAY_MODE -e GENERATION_API_BASE_URL -e GENERATION_API_KEY \
            -e GENERATION_MODEL_ALIAS -e DOCUMENT_PARSER_PROVIDER \
            -e DOCUMENT_PARSER_API_BASE_URL -e DOCUMENT_PARSER_API_KEY \
            -e DOCUMENT_PARSER_MODEL -e RAG_GRAPH_BACKEND -e RAG_ENV -e RAG_AUTH_DISABLED \
            -v "$PWD/data/raw:/workspace/data/raw:ro" \
            nano-rag-live-smoke python scripts/live_smoke.py
