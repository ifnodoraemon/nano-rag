[tool.ruff]
# The project targets Python 3.12 (see CLAUDE.md). Pinning it here makes ruff
# evaluate modern builtins correctly - without it, names such as ExceptionGroup
# and TaskGroup are reported as undefined.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# The gate this repo actually enforces: real defects (undefined names, unused
# imports, dead code, blocked async calls, swallowed exceptions). Broader style
# rule sets are intentionally not enabled - turning them on would report several
# hundred pre-existing style nits and invite a mass rewrite unrelated to any
# behavioural change.
select = ["F", "E9", "B023", "S110", "ASYNC230"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["app/tests"]
