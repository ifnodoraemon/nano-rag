# Per-location proxy headers shared by every location in default.conf.template.
#
# Security model: the public port is NOT a trusted proxy. Client-supplied
# *proxy identity* headers are stripped before the request reaches the backend,
# so a browser cannot claim a trusted-proxy identity (and therefore cannot
# spoof allowed_kb_ids or escalate to operator routes).
#
# X-Admin-API-Key is intentionally forwarded: operator routes require the
# caller to present their own admin key (the backend enforces it). Business
# routes ignore that header entirely.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

proxy_set_header X-RAG-Proxy-Secret "";
proxy_set_header X-RAG-Principal-Id "";
proxy_set_header X-RAG-Org-Id "";
proxy_set_header X-RAG-Allowed-Kb-Ids "";
