# Public entry for the SPA. Security model:
#
# - The browser never holds business credentials; nginx injects the backend
#   business key (X-API-Key) for /v1/rag/ business routes only.
# - Operator routes (/traces, /eval, /benchmark, /diagnose, /replay, /retrieve,
#   /debug, /health/detail) are proxied WITHOUT any injected credential. The
#   backend's require_admin_key enforces them, so an anonymous browser gets
#   401 and an operator presents X-Admin-API-Key themselves.
# - Client-supplied proxy-identity headers (X-RAG-Proxy-Secret and friends) are
#   stripped on every location (see snippets/proxy-common.conf): this port is
#   public, so it must never be able to assert a trusted-proxy identity.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rag_backend http://app:8000;
    root /usr/share/nginx/html;
    index index.html;
    # The app enforces MAX_UPLOAD_BYTES (default 50MB) in routes_business.py;
    # nginx's default client_max_body_size is 1MB, which would reject larger
    # uploads with 413 before they reach the app. Allow well above the app cap
    # so the app's own limit (and its per-file message) is the real gate.
    client_max_body_size 60m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE chat stream: buffering must be off or the browser sees the whole
    # stream at once after generation finishes, and the read timeout must
    # cover the full multi-stage pipeline (discovery -> read plan -> deep
    # read -> synthesis), not a single upstream call.
    location /v1/rag/chat/stream {
        proxy_pass $rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding off;
    }

    # Business API (browser-facing; backend key injected here and only here).
    location /v1/rag/ {
        proxy_pass $rag_backend;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_read_timeout 600s;
    }

    # Health (summary is public; /health/detail is admin-gated by the backend).
    location /health {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Operator routes: no injected credentials. The caller must present the
    # admin key themselves; the backend enforces it (401 without).
    location /retrieve/ {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 600s;
    }

    location /traces {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /eval/ {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 1800s;
    }

    location /benchmark/ {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 1800s;
    }

    location /diagnose/ {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 1800s;
    }

    location /replay/ {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 600s;
    }

    location /debug/ {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # FastAPI docs — disabled by default in the app (RAG_ENABLE_DOCS), so these
    # only proxy when an operator opted in.
    location /docs {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /openapi.json {
        proxy_pass $rag_backend;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
