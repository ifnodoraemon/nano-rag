server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rag_backend http://app:8000;
    root /usr/share/nginx/html;
    index index.html;
    # The app enforces MAX_UPLOAD_BYTES (default 50MB) in routes_business.py;
    # nginx's default client_max_body_size is 1MB, which would reject larger
    # uploads with 413 before they reach the app. Allow well above the app cap
    # so the app's own limit (and its per-file message) is the real gate.
    client_max_body_size 60m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Business API
    location /v1/rag/ {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Debug & admin routes
    location /health {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /retrieve/ {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /traces {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /eval/ {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /benchmark/ {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /diagnose/ {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /replay/ {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /debug/ {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Admin-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # FastAPI docs
    location /docs {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass $rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key "${RAG_PROXY_API_KEY}";
        proxy_set_header X-Real-IP $remote_addr;
    }
}
