x-app-env: &app-env
  # =================================================================== #
  # 分三层，只有「外部凭据」需要你填。                                  #
  #   1) 内部固定值：容器网络内部路径/地址，不需要也不能配。            #
  #   2) 派生值：从别的变量算出来，不再单独要求一份（见下）。            #
  #   3) 外部凭据：只有两类——生成模型、文档解析模型。                   #
  # 用 `python scripts/init_env.py` 一次性生成 docker/.env。            #
  # =================================================================== #

  # --- 1) 内部固定值（内部的 postgres/redis 不对外发布，无需密钥） ---
  APP_CONFIG_DIR: /workspace/configs
  PARSED_OUTPUT_DIR: /workspace/data/parsed
  INGEST_JOB_STORE_DIR: /workspace/data/reports/ingest_jobs
  EVAL_REPORT_DIR: /workspace/data/reports/eval
  EVAL_DATASET_DIR: /workspace/data/eval
  RAG_INGEST_ALLOWED_DIRS: /workspace/data/raw
  RAG_BROKER_URL: ${RAG_BROKER_URL:-redis://redis:6379/0}
  RAG_RESULT_BACKEND: ${RAG_RESULT_BACKEND:-redis://redis:6379/1}
  RAG_GRAPH_BACKEND: ${RAG_GRAPH_BACKEND:-postgres}
  RAG_INGEST_EXECUTOR: ${RAG_INGEST_EXECUTOR:-celery}
  # proxy 变量：容器内访问外网用，留空即直连
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},app,redis,postgres
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},app,redis,postgres
  ALL_PROXY: ""
  all_proxy: ""

  # --- 2) 派生值（不再单独配置） ------------------------------------- #
  # PG_URI 由 postgres 服务自己的 user/password/db 拼出来：一处定义，两处使用。
  PG_URI: ${PG_URI:-postgresql://${POSTGRES_USER:-nanorag}:${POSTGRES_PASSWORD:-nano-rag}@postgres:5432/${POSTGRES_DB:-nanorag}}
  # 运维接口用独立密钥；企业环境必填。本地默认由 init_env 生成。
  RAG_ENV: ${RAG_ENV:-prod}
  RAG_API_KEYS: ${RAG_API_KEYS:?run `python scripts/init_env.py` (or set RAG_API_KEYS) to generate docker/.env}
  RAG_ADMIN_API_KEYS: ${RAG_ADMIN_API_KEYS:?run `python scripts/init_env.py` (or set RAG_ADMIN_API_KEYS)}
  RAG_TRUSTED_PROXY_SECRET: ${RAG_TRUSTED_PROXY_SECRET:-}
  RAG_AUTH_DISABLED: ${RAG_AUTH_DISABLED:-}
  RAG_RATE_LIMIT_REQUESTS_PER_MINUTE: ${RAG_RATE_LIMIT_REQUESTS_PER_MINUTE:-300}
  RAG_DIAGNOSIS_ENABLED: ${RAG_DIAGNOSIS_ENABLED:-true}
  RAG_EVAL_ENABLED: ${RAG_EVAL_ENABLED:-true}
  MODEL_PROVIDER_MAX_RETRIES: ${MODEL_PROVIDER_MAX_RETRIES:-2}
  MODEL_PROVIDER_RETRY_BASE_SECONDS: ${MODEL_PROVIDER_RETRY_BASE_SECONDS:-0.5}
  MODEL_PROVIDER_RETRY_MAX_SECONDS: ${MODEL_PROVIDER_RETRY_MAX_SECONDS:-8}

  # --- 3) 外部凭据：只有这两类需要你提供 ------------------------------ #
  # 生成模型（对话/阅读计划/图抽取都走它）。MODEL_GATEWAY_* 已是历史别名，
  # 不再出现在这里：GENERATION_* 是唯一来源，代码里保留只读兼容。
  GENERATION_API_KEY: ${GENERATION_API_KEY:-${COMPOSE_GENERATION_API_KEY:-}}
  GENERATION_API_BASE_URL: ${GENERATION_API_BASE_URL:-${COMPOSE_GENERATION_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}}
  GENERATION_MODEL_ALIAS: ${GENERATION_MODEL_ALIAS:-${COMPOSE_GENERATION_MODEL_ALIAS:-gemini-flash-latest}}

  # 文档解析模型（只在你摄入 PDF/图片/Office 时需要）。
  DOCUMENT_PARSER_ENABLED: ${DOCUMENT_PARSER_ENABLED:-true}
  DOCUMENT_PARSER_PROVIDER: ${DOCUMENT_PARSER_PROVIDER:-${COMPOSE_DOCUMENT_PARSER_PROVIDER:-gemini}}
  DOCUMENT_PARSER_MODEL: ${DOCUMENT_PARSER_MODEL:-${COMPOSE_DOCUMENT_PARSER_MODEL:-gemini-flash-latest}}
  DOCUMENT_PARSER_API_BASE_URL: ${DOCUMENT_PARSER_API_BASE_URL:-${COMPOSE_DOCUMENT_PARSER_API_BASE_URL:-https://generativelanguage.googleapis.com}}
  DOCUMENT_PARSER_API_KEY: ${DOCUMENT_PARSER_API_KEY:-${COMPOSE_DOCUMENT_PARSER_API_KEY:-}}

  # 可选：cross-encoder 重排。默认关闭；开启需要同时给 path。
  RERANK_MODEL_ALIAS: ${RERANK_MODEL_ALIAS:-${COMPOSE_RERANK_MODEL_ALIAS:-disabled}}
  RERANK_API_BASE_URL: ${RERANK_API_BASE_URL:-${COMPOSE_RERANK_API_BASE_URL:-}}
  RERANK_API_KEY: ${RERANK_API_KEY:-${COMPOSE_RERANK_API_KEY:-}}
  RERANK_API_PATH: ${RERANK_API_PATH:-${COMPOSE_RERANK_API_PATH:-}}
  DISABLE_RERANK: ${DISABLE_RERANK:-${COMPOSE_DISABLE_RERANK:-true}}

services:
  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: nanorag-app
    expose:
      - "8000"
    # Reach a model gateway running on the host (outside this compose project).
    # host-gateway resolves to the host's bridge address regardless of subnet,
    # so the value does not depend on a hardcoded 172.x IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-env
      # PostgreSQL default max_connections is 100. Budget: app 8 + 32 workers
      # x 2 = 72, leaving headroom for migrations/maintenance.
      RAG_PG_POOL_MIN: ${RAG_PG_POOL_MIN:-1}
      RAG_PG_POOL_MAX: ${RAG_PG_POOL_MAX:-8}
    volumes:
      - ../configs:/workspace/configs:ro
      - ../data/raw:/workspace/data/raw:ro
      - ../data/eval:/workspace/data/eval:ro
      - app-parsed-data:/workspace/data/parsed
      - app-report-data:/workspace/data/reports
      - app-upload-data:/workspace/data/uploads
      - app-wiki-data:/workspace/data/wiki
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: nanorag-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "celery",
        "-A",
        "app.ingestion.tasks:celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=prefork",
        "--concurrency=${RAG_WORKER_CONCURRENCY:-32}",
        "--max-tasks-per-child=${RAG_WORKER_MAX_TASKS_PER_CHILD:-20}",
        "--prefetch-multiplier=${RAG_WORKER_PREFETCH_MULTIPLIER:-1}",
        "-Q",
        "ingest",
      ]
    environment:
      <<: *app-env
      # Workers each run their own pool; with the default concurrency of 32
      # this stays within PostgreSQL's default max_connections=100.
      RAG_PG_POOL_MIN: ${RAG_WORKER_PG_POOL_MIN:-1}
      RAG_PG_POOL_MAX: ${RAG_WORKER_PG_POOL_MAX:-2}
    volumes:
      - ../configs:/workspace/configs:ro
      - ../data/raw:/workspace/data/raw:ro
      - ../data/eval:/workspace/data/eval:ro
      - app-parsed-data:/workspace/data/parsed
      - app-report-data:/workspace/data/reports
      - app-upload-data:/workspace/data/uploads
      - app-wiki-data:/workspace/data/wiki
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: nanorag-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: nanorag-postgres
    environment:
      # The single definition of the database credentials: PG_URI in x-app-env
      # is derived from these three, so there is no second place to update.
      # The service is expose-only (not published), so this is internal wiring,
      # not an operator-facing secret - init_env generates it anyway.
      POSTGRES_USER: ${POSTGRES_USER:-nanorag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${PG_PASSWORD:-nano-rag}}
      POSTGRES_DB: ${POSTGRES_DB:-nanorag}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nanorag} -d ${POSTGRES_DB:-nanorag}",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: nanorag-frontend
    ports:
      # Bound to loopback by default: the proxy injects the business key, so
      # anything that can reach this port is authenticated as a business
      # caller. Publish on 0.0.0.0 only behind your own authenticating proxy.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3001}:80"
    environment:
      # nginx injects this for /v1/rag/ business routes only. It must be ONE
      # business key, so it is derived from RAG_API_KEYS (which init_env writes
      # as a single key) instead of being a third copy of the same secret.
      # Override only if the browser-facing key must differ from the first one.
      RAG_PROXY_API_KEY: ${RAG_PROXY_API_KEY:-${RAG_API_KEYS}}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # The public entry needs its own liveness signal: without it a broken nginx
    # config looks healthy to compose and to the port binding.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app-parsed-data:
  app-report-data:
  app-upload-data:
  app-wiki-data:
  redis-data:
  postgres-data:
