services:
  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: nanorag-app
    expose:
      - "8000"
    environment: &app-env
      APP_CONFIG_DIR: /workspace/configs
      RAG_ENV: ${RAG_ENV:-local}
      VECTORSTORE_BACKEND: ${VECTORSTORE_BACKEND:-milvus}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_USER: ${MILVUS_USER:-}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},app,redis,neo4j,milvus,etcd,minio
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},app,redis,neo4j,milvus,etcd,minio
      ALL_PROXY: ""
      all_proxy: ""
      PARSED_OUTPUT_DIR: /workspace/data/parsed
      INGEST_JOB_STORE_DIR: /workspace/data/reports/ingest_jobs
      RAG_INGEST_EXECUTOR: ${RAG_INGEST_EXECUTOR:-celery}
      RAG_BROKER_URL: ${RAG_BROKER_URL:-redis://redis:6379/0}
      RAG_RESULT_BACKEND: ${RAG_RESULT_BACKEND:-redis://redis:6379/1}
      RAG_GRAPH_BACKEND: ${RAG_GRAPH_BACKEND:-neo4j}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nano-rag-graph}
      EVAL_REPORT_DIR: /workspace/data/reports/eval
      RAG_INGEST_ALLOWED_DIRS: /workspace/data/raw
      EVAL_DATASET_DIR: /workspace/data/eval
      RAG_AUTH_DISABLED: ${RAG_AUTH_DISABLED:-}
      RAG_API_KEYS: ${RAG_API_KEYS:-nano-rag-local}
      RAG_ADMIN_API_KEYS: ${RAG_ADMIN_API_KEYS:-nano-rag-local}
      RAG_TRUSTED_PROXY_SECRET: ${RAG_TRUSTED_PROXY_SECRET:-}
      RAG_RATE_LIMIT_REQUESTS_PER_MINUTE: ${RAG_RATE_LIMIT_REQUESTS_PER_MINUTE:-0}
      RAG_DIAGNOSIS_ENABLED: ${RAG_DIAGNOSIS_ENABLED:-true}
      RAG_EVAL_ENABLED: ${RAG_EVAL_ENABLED:-true}
      # Document-level BM25 discovery layer (the wiki). On by default.
      RAG_WIKI_ENABLED: ${RAG_WIKI_ENABLED:-true}
      MODEL_PROVIDER_MAX_RETRIES: ${MODEL_PROVIDER_MAX_RETRIES:-2}
      MODEL_PROVIDER_RETRY_BASE_SECONDS: ${MODEL_PROVIDER_RETRY_BASE_SECONDS:-0.5}
      MODEL_PROVIDER_RETRY_MAX_SECONDS: ${MODEL_PROVIDER_RETRY_MAX_SECONDS:-8}
      MODEL_GATEWAY_MODE: ${MODEL_GATEWAY_MODE:-live}
      MODEL_GATEWAY_BASE_URL: ${COMPOSE_MODEL_GATEWAY_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      MODEL_GATEWAY_API_KEY: ${COMPOSE_MODEL_GATEWAY_API_KEY:-}
      GENERATION_MODEL_ALIAS: ${COMPOSE_GENERATION_MODEL_ALIAS:-gemini-flash-lite-latest}
      GENERATION_API_BASE_URL: ${COMPOSE_GENERATION_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GENERATION_API_KEY: ${COMPOSE_GENERATION_API_KEY:-}
      # Multimodal embedding calls the configured provider directly.
      # No alternate provider key is applied.
      EMBEDDING_PROVIDER: ${COMPOSE_EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL_ALIAS: ${COMPOSE_EMBEDDING_MODEL_ALIAS:-gemini-embedding-2-preview}
      EMBEDDING_API_BASE_URL: ${COMPOSE_EMBEDDING_API_BASE_URL:-https://generativelanguage.googleapis.com}
      EMBEDDING_API_KEY: ${COMPOSE_EMBEDDING_API_KEY:-}

      DOCUMENT_PARSER_ENABLED: ${DOCUMENT_PARSER_ENABLED:-true}
      DOCUMENT_PARSER_PROVIDER: ${COMPOSE_DOCUMENT_PARSER_PROVIDER:-gemini}
      DOCUMENT_PARSER_MODEL: ${COMPOSE_DOCUMENT_PARSER_MODEL:-gemini-flash-lite-latest}
      DOCUMENT_PARSER_API_BASE_URL: ${COMPOSE_DOCUMENT_PARSER_API_BASE_URL:-https://generativelanguage.googleapis.com}
      DOCUMENT_PARSER_API_KEY: ${COMPOSE_DOCUMENT_PARSER_API_KEY:-}
      RERANK_MODEL_ALIAS: ${COMPOSE_RERANK_MODEL_ALIAS:-disabled}
      RERANK_API_BASE_URL: ${COMPOSE_RERANK_API_BASE_URL:-}
      RERANK_API_KEY: ${COMPOSE_RERANK_API_KEY:-}
      RERANK_API_PATH: ${COMPOSE_RERANK_API_PATH:-}
      DISABLE_RERANK: ${COMPOSE_DISABLE_RERANK:-true}
    volumes:
      - ../configs:/workspace/configs:ro
      - ../data/raw:/workspace/data/raw:ro
      - ../data/eval:/workspace/data/eval:ro
      - app-parsed-data:/workspace/data/parsed
      - app-report-data:/workspace/data/reports
      - app-upload-data:/workspace/data/uploads
      - app-wiki-data:/workspace/data/wiki
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: nanorag-worker
    command:
      [
        "celery",
        "-A",
        "app.ingestion.tasks:celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=prefork",
        "--concurrency=${RAG_WORKER_CONCURRENCY:-32}",
        "--max-tasks-per-child=${RAG_WORKER_MAX_TASKS_PER_CHILD:-20}",
        "--prefetch-multiplier=${RAG_WORKER_PREFETCH_MULTIPLIER:-1}",
        "-Q",
        "ingest",
      ]
    environment: *app-env
    volumes:
      - ../configs:/workspace/configs:ro
      - ../data/raw:/workspace/data/raw:ro
      - ../data/eval:/workspace/data/eval:ro
      - app-parsed-data:/workspace/data/parsed
      - app-report-data:/workspace/data/reports
      - app-upload-data:/workspace/data/uploads
      - app-wiki-data:/workspace/data/wiki
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: nanorag-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  neo4j:
    image: neo4j:5.26-community
    container_name: nanorag-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-nano-rag-graph}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-4G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-4G}
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-nano-rag-graph} 'RETURN 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: nanorag-etcd
    environment:
      ETCDCTL_API: "3"
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      /usr/local/bin/etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: nanorag-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: minio server /minio_data
    expose:
      - "9000"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/9000 && exec 3<&- && exec 3>&-"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  milvus:
    image: milvusdb/milvus:v2.6.15
    container_name: nanorag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    expose:
      - "19530"
      - "9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - milvus-data:/var/lib/milvus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: nanorag-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    environment:
      RAG_PROXY_API_KEY: ${RAG_PROXY_API_KEY:-nano-rag-local}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-parsed-data:
  app-report-data:
  app-upload-data:
  app-wiki-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  neo4j-data:
  neo4j-logs:
